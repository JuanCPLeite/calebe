openapi: 3.0.3
info:
  title: Carousel Studio Admin API
  version: 1.0.0
  description: Endpoints administrativos (owner-only).
servers:
  - url: http://localhost:8080
paths:
  /api/admin/settings:
    get:
      summary: Lê configurações globais de chaves
      tags: [Admin Settings]
      responses:
        '200':
          description: Configurações carregadas
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
    patch:
      summary: Atualiza chaves globais
      tags: [Admin Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                anthropicKey: { type: string }
                googleKey: { type: string }
                openaiKey: { type: string }
                exaKey: { type: string }
      responses:
        '200':
          description: Configurações atualizadas
        '400':
          description: Payload inválido
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
  /api/admin/settings/reveal:
    post:
      summary: Revela chave atual de um provider (owner-only)
      tags: [Admin Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [anthropic, google, openai, exa]
      responses:
        '200':
          description: Valor da chave retornado
        '400':
          description: Provider inválido
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
  /api/admin/settings/test:
    post:
      summary: Testa conexão do provider usando chave salva
      tags: [Admin Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [anthropic, google, openai, exa]
      responses:
        '200':
          description: Resultado do teste de conexão
        '400':
          description: Provider inválido
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
  /api/admin/workspaces:
    get:
      summary: Lista workspaces
      tags: [Admin Workspaces]
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: plan
          schema:
            type: string
          description: ID de plano cadastrado em /api/admin/plans
        - in: query
          name: active
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Lista de workspaces com métricas agregadas (membros, uso e última atividade)
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
    post:
      summary: Cria workspace
      tags: [Admin Workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, plan]
              properties:
                name:
                  type: string
                slug:
                  type: string
                plan:
                  type: string
                  description: ID de plano cadastrado em /api/admin/plans
                ownerUserId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Workspace criado (retorna também métricas agregadas)
        '400':
          description: Payload inválido
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
    patch:
      summary: Atualiza workspace (nome/plano/status)
      tags: [Admin Workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                plan:
                  type: string
                  description: ID de plano cadastrado em /api/admin/plans
                active:
                  type: boolean
      responses:
        '200':
          description: Workspace atualizado (retorna também métricas agregadas)
        '400':
          description: Payload inválido
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
  /api/admin/plans:
    get:
      summary: Lista planos configurados pela plataforma
      tags: [Admin Plans]
      responses:
        '200':
          description: Lista de planos com limites
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
    patch:
      summary: Atualiza planos e limites
      tags: [Admin Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plans]
              properties:
                plans:
                  type: array
                  items:
                    type: object
                    required: [id, label, expertLimit]
                    properties:
                      id: { type: string }
                      label: { type: string }
                      expertLimit: { type: integer, minimum: 1, maximum: 100 }
                      description: { type: string }
      responses:
        '200':
          description: Planos atualizados
        '400':
          description: Payload inválido
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
  /api/admin/workspaces/{id}:
    get:
      summary: Detalha um workspace
      tags: [Admin Workspaces]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes do workspace (membros, uso, logs)
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
        '404':
          description: Workspace não encontrado
  /api/admin/logs:
    get:
      summary: Lista logs de sistema
      tags: [Admin Logs]
      parameters:
        - in: query
          name: level
          schema:
            type: string
            enum: [info, warn, error]
        - in: query
          name: event
          schema: { type: string }
        - in: query
          name: workspaceId
          schema:
            type: string
            format: uuid
        - in: query
          name: days
          schema:
            type: integer
            minimum: 1
            maximum: 365
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Lista de logs
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
  /api/admin/metrics:
    get:
      summary: Métricas e atividade recente do dashboard admin
      tags: [Admin Dashboard]
      responses:
        '200':
          description: Cards de métricas + erros 24h + atividade recente
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
  /api/admin/costs:
    get:
      summary: Agregados de custo por período/workspace
      tags: [Admin Costs]
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            minimum: 1
            maximum: 365
        - in: query
          name: workspaceId
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Custo total, top workspaces, top usuários e top modelos
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
  /api/admin/users:
    get:
      summary: Lista usuários da plataforma
      tags: [Admin Users]
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [owner, admin, member]
        - in: query
          name: workspaceId
          schema:
            type: string
            format: uuid
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: Lista de usuários
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
    patch:
      summary: Atualiza role/workspace de usuário
      tags: [Admin Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum: [owner, admin, member]
                workspaceId:
                  nullable: true
                  oneOf:
                    - type: string
                      format: uuid
                    - type: 'null'
      responses:
        '200':
          description: Usuário atualizado
        '400':
          description: Payload inválido
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
components:
  securitySchemes:
    SupabaseSession:
      type: apiKey
      in: cookie
      name: sb-access-token
